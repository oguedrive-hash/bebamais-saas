name: build-image

# A "receita": builda a imagem do painel e publica no GHCR.
# Mata o bug do build-arg — os NEXT_PUBLIC_* vêm de repo Variables (cada clone
# seta os seus em Settings > Secrets and variables > Actions > Variables),
# nunca mais um `docker build` manual esquecendo o argumento e derrubando o site.

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - ".env.example"
  workflow_dispatch: {}

concurrency:
  group: build-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/oguedrive-hash/facilita-painel

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verifica build-args (falha cedo se um clone esquecer)
        run: |
          test -n "${{ vars.NEXT_PUBLIC_SUPABASE_URL }}" || { echo "::error::repo Variable NEXT_PUBLIC_SUPABASE_URL não setada"; exit 1; }
          test -n "${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" || { echo "::error::repo Variable NEXT_PUBLIC_SUPABASE_ANON_KEY não setada"; exit 1; }

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo
        run: |
          echo "### Imagem publicada 🐳" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
